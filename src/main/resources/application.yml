server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service
  profiles:
    default: local
  config:
    import: "optional:configserver:"

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        impl.uuid_binary_compatibility: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 3000
            logger-level: basic


message:
  exchange: baekma.exchange # Producer만 적용
  queue:
    notification: notification.queue
    company: company.queue
  binding-key:
    notification:
      inventory-low: hub.inventory.low
      order-created: order.created
      order-canceled: order.canceled
      order-completed: order.completed
      transmit-slack-message: notification.slack-message.transmit
    hub:
      route-changed: hub.route.changed
    company:
      hub-deleted: hub.deleted

springdoc:
  api-docs:
    path: /api/api-spec
    enabled: true
  swagger-ui:
    path: /api/api-docs
    enabled: true
  override-with-generic-response: false
  use-fqn: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
eureka:
  client:
    enabled: false
